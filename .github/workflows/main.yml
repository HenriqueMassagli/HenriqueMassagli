```yaml
name: generate animation

on:

  # Run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # Allows the workflow to be manually executed
  workflow_dispatch:

  # Run on every push to the master branch
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      # Generate the GitHub contribution snake animation
      - name: Generate GitHub contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#D8C2FF&color_dots=#16121F,#241936,#382457,#56358A,#7B4CC2
            dist/github-contribution-grid-snake-dark.svg?color_snake=#D8C2FF&color_dots=#16121F,#241936,#382457,#7B4CC2,#B58CFF

      # Push generated files to the output branch
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
